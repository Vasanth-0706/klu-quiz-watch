name: klu-quiz-watch
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may delay runs by a few minutes
  workflow_dispatch:
permissions:
  contents: write
concurrency: quiz-watch
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python watch.py
        env:
          LMS_USER: ${{ secrets.LMS_USER }}
          LMS_PASS: ${{ secrets.LMS_PASS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          COURSE_ID: "14533"
      - name: Save state
        run: |
          git config user.name "quiz-watch"; git config user.email "bot@users.noreply.github.com"
          git add state.json && (git diff --cached --quiet || git commit -m "state" && git push)
